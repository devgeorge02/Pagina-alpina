<!doctype html>
<html lang="es" data-bs-theme="light">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alpina | Gestión de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../css/admin/panel.css">
</head>

<body class="bg-primary">
    <div class="admin-wrapper">
        <aside class="sidebar">
            <div class="sidebar-user">
                <i class="bi bi-person-circle"></i>
                <span class="small text-uppercase tracking-wider">Administrador</span>
            </div>
            <nav class="nav flex-column">
                <a class="nav-link" href="panel.html"><i class="bi bi-house-door"></i> Inicio</a>
                <a class="nav-link" href="empleados.html"><i class="bi bi-people"></i> Empleados</a>
                <a class="nav-link" href="archivos.html"><i class="bi bi-file-earmark-text"></i> Archivos</a>
                <a class="nav-link" href="factura.html"><i class="bi bi-receipt"></i> Factura</a>
                <a class="nav-link" href="bancos.html"><i class="bi bi-bank"></i> Bancos</a>
                <a class="nav-link active" href="inventario.html"><i class="bi bi-box-seam"></i> Inventario</a>
                <a class="nav-link logout-link" href="login.html" data-logout><i class="bi bi-box-arrow-right"></i> Cerrar sesión</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="content-header mb-4">
                <h1 class="content-header-line">Gestión de Inventario</h1>
            </header>

            <section class="content-actions">
                <div class="row g-3 mb-4">
                <div class="col-md-8">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-secondary"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control border-secondary" placeholder="Buscar producto por SKU o nombre...">
                    </div>
                </div>
                <div class="col-md-4 text-md-end">
                    <button class="btn btn-primary w-100 bg-info border-info text-dark font-weight-bold" style="background-color: rgb(28, 156, 230) !important; border: none !important; color: white !important;">
                        <i class="bi bi-plus-square me-2"></i>Agregar Producto
                    </button>
                </div>
            </div>

            <!-- Tabla de Datos Administrativa Metódica -->
            <div class="table-responsive">
                <table class="table table-bordered table-striped table-hover align-middle table-admin m-0">
                    <thead>
                        <tr>
                            <th scope="col" class="py-3 px-3">SKU</th>
                            <th scope="col" class="py-3 px-3">Producto</th>
                            <th scope="col" class="py-3 px-3">Cantidad</th>
                            <th scope="col" class="py-3 px-3">Ubicación</th>
                            <th scope="col" class="py-3 px-3">Estado</th>
                            <th scope="col" class="py-3 px-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="px-3 font-monospace">SKU-100</td>
                            <td>Leche Entera 1L</td>
                            <td>240 und</td>
                            <td>Bodega A</td>
                            <td><span class="badge bg-success rounded-0">Disponible</span></td>
                            <td class="text-center"><button class="btn btn-outline-secondary btn-sm"><i class="bi bi-pencil-square"></i></button></td>
                        </tr>
                        <tr>
                            <td class="px-3 font-monospace">SKU-101</td>
                            <td>Yogur Finesse</td>
                            <td>58 und</td>
                            <td>Bodega C</td>
                            <td><span class="badge bg-warning text-dark rounded-0">Bajo stock</span></td>
                            <td class="text-center"><button class="btn btn-outline-secondary btn-sm"><i class="bi bi-pencil-square"></i></button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <footer class="admin-footer text-center py-3 mt-4 bg-primary text-white">
        <p class="small mb-0">© 2026 Alpina - Panel Administrativo.</p>
    </footer>
    <script src="../../js/admin/panel.js"></script>
</body>
</html>
